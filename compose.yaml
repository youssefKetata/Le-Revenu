services:
  database:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-le_revenu}
      POSTGRES_USER: ${DATABASE_USERNAME:-le_revenu}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Use --env-file backend/.env with generated credentials}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    env_file: backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      FRONTEND_URL: http://localhost:3000
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-le_revenu}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-le_revenu}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Use --env-file backend/.env with generated credentials}
      DATABASE_SCHEMA: public
      DATABASE_SSL: "false"
    ports:
      - "127.0.0.1:1337:1337"
    volumes:
      - uploads:/app/backend/public/uploads
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:1337/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 12

  frontend:
    build: ./frontend
    init: true
    environment:
      NODE_ENV: production
      STRAPI_URL: http://backend:1337
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 12

volumes:
  postgres_data:
  uploads:
